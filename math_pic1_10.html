<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตัวเลขให้ตรงกับจำนวนภาพ 1-10</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap');
        
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #FFE5EC 0%, #D8B4F8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 8px solid #FFF;
        }

        h1 {
            color: #FF6B6B;
            font-size: 26px;
            margin-top: 0;
        }

        .score-board {
            font-size: 18px;
            color: #4D4D4D;
            font-weight: bold;
            margin-bottom: 15px;
            background: #F0F0F0;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
        }

        /* ขยายพื้นที่และขนาดอีโมจิให้ใหญ่ชัดเจน */
        .image-display-area {
            background-color: #FAFAFA;
            border: 4px dashed #FFD166;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 65px; 
            user-select: none;
        }

        .instruction {
            font-size: 20px;
            color: #4A90E2;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* ปรับตารางตัวเลือกให้เหลือ 5 ปุ่ม เรียงแถวเดียวหรือสวยงาม */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-option {
            background-color: #FFF;
            border: 3px solid #E0E0E0;
            border-bottom: 6px solid #E0E0E0;
            border-radius: 18px;
            font-size: 30px; /* ขยายตัวเลขในปุ่มให้ใหญ่ชัดเจน */
            font-weight: bold;
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #4D4D4D;
        }

        .btn-option:active {
            border-bottom-width: 3px;
            transform: translateY(3px);
        }

        .btn-option.correct {
            background-color: #69DB7C !important;
            border-color: #2B8A3E !important;
            border-bottom-color: #2B8A3E !important;
            color: white !important;
        }

        .btn-option.wrong {
            background-color: #FF8787 !important;
            border-color: #C92A2A !important;
            border-bottom-color: #C92A2A !important;
            color: white !important;
        }

        .feedback-message {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 30px;
        }
        
        .summary-screen {
            display: none;
        }
        
        .btn-restart {
            background-color: #4A90E2;
            border: none;
            border-bottom: 6px solid #2260A8;
            color: white;
            padding: 12px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="game-screen">
            <h1> 🎯 เกมตัวเลขให้ตรงกับจำนวนภาพ 1-10 </h1>
            <div class="score-board">ข้อที่ <span id="current-question-num">1</span>/10 | คะแนน: <span id="current-score">0</span></div>
            <div class="instruction">มีจำนวนทั้งหมดกี่ชิ้น? นับแล้วเลือกคำตอบเลย!</div>
            
            <div class="image-display-area" id="image-area"></div>
            
            <div class="feedback-message" id="feedback"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div class="summary-screen" id="summary-screen">
            <h1>🎉 จบเกมแล้วจ้า! 🎉</h1>
            <div style="font-size: 70px; margin: 20px 0;">🏆</div>
            <div class="instruction" style="font-size: 24px;">หนูๆ ทำคะแนนได้ทั้งหมด</div>
            <div style="font-size: 40px; font-weight: bold; color: #FF6B6B; margin-bottom: 30px;">
                <span id="final-score">0</span> / 10 คะแนน
            </div>
            <button class="btn-restart" onclick="restartGame()">เล่นอีกครั้ง 🔄</button>
        </div>
    </div>

    <script>
        const emojiList = ['🐱', '🐶', '🍎', '🍓', '🧸', '🚗', '🍩', '🍦', '🐤', '🐰', '🍇', '🐼', '🥕'];
        let currentQuestion = 1;
        let score = 0;
        let correctAnswer = 0;
        let isChecked = false; 
        let usedNumbers = [];

        function speakThai(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startGame() {
            currentQuestion = 1;
            score = 0;
            usedNumbers = [];
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('summary-screen').style.display = 'none';
            document.getElementById('current-score').textContent = score;
            setupQuestion();
        }

        function setupQuestion() {
            isChecked = false;
            document.getElementById('current-question-num').textContent = currentQuestion;
            document.getElementById('feedback').textContent = '';
            
            do {
                correctAnswer = Math.floor(Math.random() * 10) + 1;
            } while (usedNumbers.includes(correctAnswer) && usedNumbers.length < 10);
            
            usedNumbers.push(correctAnswer);
            const randomEmoji = emojiList[Math.floor(Math.random() * emojiList.length)];
            
            // แสดงรูปภาพโจทย์ขนาดใหญ่
            const imageArea = document.getElementById('image-area');
            imageArea.innerHTML = '';
            for(let i = 0; i < correctAnswer; i++) {
                imageArea.innerHTML += `<span>${randomEmoji}</span>`;
            }

            // สุ่มตัวเลือก 5 ตัว (รวมตัวที่ถูกต้อง และตัวเลขอื่นที่ไม่ซ้ำกัน 1-10)
            let optionSet = new Set([correctAnswer]);
            while(optionSet.size < 5) {
                let randomNum = Math.floor(Math.random() * 10) + 1;
                optionSet.add(randomNum);
            }
            
            // แปลง Set เป็น Array แล้วสลับตำแหน่ง (Shuffle)
            let optionsArray = Array.from(optionSet);
            optionsArray.sort(() => Math.random() - 0.5);

            // สร้างปุ่มตัวเลือก 5 ปุ่ม
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            optionsArray.forEach(num => {
                optionsContainer.innerHTML += `<button class="btn-option" id="opt-${num}" onclick="checkAnswer(${num})">${num}</button>`;
            });
        }

        function checkAnswer(selectedNumber) {
            if (isChecked) return; 

            const selectedButton = document.getElementById(`opt-${selectedNumber}`);

            if (selectedNumber === correctAnswer) {
                isChecked = true;
                selectedButton.classList.add('correct');
                score++;
                document.getElementById('current-score').textContent = score;
                document.getElementById('feedback').textContent = '✨ ถูกต้องแล้วจ้า! เก่งมาก ๆ เลย 🌟';
                document.getElementById('feedback').style.color = '#2B8A3E';
                
                // ปิดการกดทุกปุ่มเมื่อตอบถูก
                const allButtons = document.querySelectorAll('.btn-option');
                allButtons.forEach(btn => btn.style.pointerEvents = 'none');

                speakThai("ถูกต้องแล้วจ้า เก่งมาก ๆ เลย");

                // เลื่อนไปข้อถัดไปอัตโนมัติหลัง 2.2 วินาที
                setTimeout(() => {
                    if (currentQuestion < 10) {
                        currentQuestion++;
                        setupQuestion();
                    } else {
                        document.getElementById('game-screen').style.display = 'none';
                        document.getElementById('summary-screen').style.display = 'block';
                        document.getElementById('final-score').textContent = score;
                        speakThai(`เก่งมากจ้า หนูทำได้ ${score} คะแนน`);
                    }
                }, 2200);

            } else {
                // ตอบผิด ให้ขึ้นเตือนและเปิดโอกาสให้เลือกใหม่เฉพาะปุ่มที่ผิด
                selectedButton.classList.add('wrong');
                selectedButton.style.pointerEvents = 'none'; // ปิดไม่ให้กดปุ่มเดิมซ้ำ
                document.getElementById('feedback').textContent = '❌ ยังไม่ถูกน้า ลองใหม่นะจ๊ะ 😊';
                document.getElementById('feedback').style.color = '#C92A2A';
                speakThai("ลองใหม่นะ");
            }
        }

        function restartGame() {
            startGame();
        }

        startGame();
    </script>
</body>
</html>
