<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมพยัญชนะไทยตามคำสั่ง ก-ถ (ตัวเลือก 5 ตัว)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-200 to-sky-200 flex items-center justify-center min-h-screen p-3">
    <!-- กรอบหลักขนาดใหญ่เต็มมือถือ -->
    <div class="bg-white rounded-3xl shadow-2xl p-5 w-full max-w-lg text-center relative">
        <!-- ไอคอนตกแต่ง -->
        <div class="text-4xl mb-1">❌🇹🇭</div>
        
        <!-- หัวข้อเกมและสถานะข้อ -->
        <h2 class="text-xl font-bold text-emerald-600 mb-1">เกมพยัญชนะไทยตามคำสั่ง ก-ถ</h2>
        <div class="flex justify-between items-center px-2 text-base text-blue-600 font-semibold mb-2">
            <span id="question-tracker">ข้อที่: 1 / 30</span>
            <span>⭐ คะแนน: <span id="score">0</span></span>
        </div>
        
        <p class="text-base font-semibold text-gray-800 mb-3">ฟังเสียงแล้วกากบาทพยัญชนะนั้น</p>

        <!-- พื้นที่แสดงพยัญชนะตัวเลือก (ปรับเหลือ 5 ตัวเลือก เพื่อความใหญ่สะใจ) -->
        <div id="grid-container" class="grid grid-cols-5 gap-3 mb-4 p-3 bg-gray-50 rounded-2xl min-h-[140px] items-center justify-center">
            <!-- สร้างปุ่มตัวเลือกพยัญชนะด้วย JavaScript -->
        </div>
        
        <!-- ปุ่มกดฟังเสียงซ้ำ (ย้ายมาไว้ด้านล่างของตารางตัวเลือก) -->
        <button onclick="speakQuestion()" class="mb-4 bg-emerald-100 text-emerald-700 px-8 py-3 rounded-full text-base font-bold hover:bg-emerald-200 transition shadow-md active:scale-95">
            🔊 ฟังเสียงอีกครั้ง
        </button>

        <!-- คะแนนดาวด้านล่าง -->
        <div class="flex justify-center gap-2 text-xl">⭐ ⭐ ⭐</div>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 30;
        let score = 0;
        let targetLetter = '';

        // ข้อมูลพยัญชนะไทย ก - ถ พร้อมคำอ่านเต็มคำ
        const thaiConsonants = [
            { char: "ก", sound: "ก ไก่" },
            { char: "ข", sound: "ข ไข่" },
            { char: "ฃ", sound: "ฃ ขวด" },
            { char: "ค", sound: "ค ควาย" },
            { char: "ฅ", sound: "ฅ คน" },
            { char: "ฆ", sound: "ฆ ระฆัง" },
            { char: "ง", sound: "ง งู" },
            { char: "จ", sound: "จ จาน" },
            { char: "ฉ", sound: "ฉ ฉิ่ง" },
            { char: "ช", sound: "ช ช้าง" },
            { char: "ซ", sound: "ซ โซ่" },
            { char: "ฌ", sound: "ฌ เฌอ" },
            { char: "ญ", sound: "ญ หญิง" },
            { char: "ฎ", sound: "ฎ ชฎา" },
            { char: "ฏ", sound: "ฏ ปฏัก" },
            { char: "ฐ", sound: "ฐ ฐาน" },
            { char: "ฑ", sound: "ฑ มณโฑ" },
            { char: "ฒ", sound: "ฒ ผู้เฒ่า" },
            { char: "ณ", sound: "ณ เณร" },
            { char: "ด", sound: "ด เด็ก" },
            { char: "ต", sound: "ต เต่า" },
            { char: "ถ", sound: "ถ ถุง" }
        ];

        let targetObj = {};

        // ฟังก์ชันสั่งพูดภาษาไทย
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.85; // ความเร็วพอดี ฟังชัดเจน
                window.speechSynthesis.speak(utterance);
            }
        }

        // ฟังก์ชันออกเสียงพยัญชนะเป้าหมายแบบเต็มคำ
        function speakQuestion() {
            speakText(targetObj.sound);
        }

        function nextQuestion() {
            if (currentQuestion > totalQuestions) {
                speakText(`จบเกมแล้วครับ คุณได้คะแนน ${score} คะแนน จาก 30 คะแนน`);
                alert(`🎉 จบเกมแล้ว! คุณได้คะแนน ${score} / 30 คะแนน`);
                currentQuestion = 1;
                score = 0;
            }

            document.getElementById('question-tracker').innerText = `ข้อที่: ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('score').innerText = score;

            // สุ่มพยัญชนะเป้าหมายจาก ก - ถ
            targetObj = thaiConsonants[Math.floor(Math.random() * thaiConsonants.length)];
            targetLetter = targetObj.char;

            // สุ่มตัวเลือกเพียง 5 ตัวจากช่วง ก - ถ มาแสดงในตาราง
            let choices = [targetObj];
            while (choices.length < 5) {
                let randomItem = thaiConsonants[Math.floor(Math.random() * thaiConsonants.length)];
                if (!choices.some(item => item.char === randomItem.char)) {
                    choices.push(randomItem);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            
            choices.forEach(item => {
                const btn = document.createElement('button');
                // ปรับขนาดตัวอักษรให้ใหญ่ขึ้นเป็น text-4xl และเพิ่มความสูงปุ่มให้กดง่ายเต็มมือถือ
                btn.className = `bg-white border-2 border-emerald-300 text-emerald-800 font-extrabold text-4xl py-6 rounded-2xl shadow-md hover:bg-emerald-50 active:scale-95 transition-all flex items-center justify-center relative`;
                btn.innerText = item.char;
                
                btn.onclick = () => {
                    if (item.char === targetLetter) {
                        btn.innerHTML = `<span class="text-5xl text-red-500 font-bold">❌</span>`;
                        btn.className = `bg-red-50 border-2 border-red-300 font-bold py-6 rounded-2xl shadow-md flex items-center justify-center`;
                        score += 1;
                        speakText('ถูกต้องครับ');
                        
                        disableAllButtons(true);
                        currentQuestion++;
                        setTimeout(nextQuestion, 1200);
                    } else {
                        btn.innerHTML = `<span class="text-4xl text-gray-400">❌</span>`;
                        speakText('ลองใหม่ครับ');
                    }
                };
                gridContainer.appendChild(btn);
            });

            // ออกเสียงพยัญชนะทันทีเมื่อเปลี่ยนข้อ
            setTimeout(speakQuestion, 400);
        }

        function disableAllButtons(disable) {
            const buttons = document.querySelectorAll('#grid-container button');
            buttons.forEach(btn => btn.disabled = disable);
        }

        window.onload = () => {
            nextQuestion();
        };
    </script>
</body>
</html>
