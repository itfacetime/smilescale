<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมตัวเลขตามคำสั่ง 1-10 | เกมฝึกคณิตศาสตร์</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:"Noto Sans Thai","Tahoma",sans-serif;
  background:linear-gradient(135deg,#fff7e6,#ffeef5);
  color:#333;
}
.game{
  width:min(94vw,560px); padding:22px; text-align:center;
  background:#fff; border-radius:28px; box-shadow:0 12px 40px #0002;
}
h1{margin:0 0 5px;font-size:clamp(26px,7vw,40px)}
.sub{color:#777;margin-bottom:12px}
.character{
  width:115px;height:115px;margin:8px auto 2px;position:relative;
  background:#ffdca8;border:5px solid #222;border-radius:50%;
  overflow:hidden;
}
.hair{position:absolute;left:0;top:0;width:100%;height:47px;background:#111;
  clip-path:polygon(0 0,100% 0,92% 48%,76% 27%,61% 49%,48% 24%,32% 48%,17% 27%,5% 48%);
}
.eye{position:absolute;top:55px;width:13px;height:18px;background:#111;border-radius:50%}
.eye.l{left:27px}.eye.r{right:27px}
.nose{position:absolute;top:73px;left:51px;width:10px;height:7px;border-radius:50%;background:#e77}
.mouth{position:absolute;top:79px;left:35px;width:45px;height:22px;border-bottom:5px solid #111;border-radius:0 0 50% 50%}
.shirt{position:absolute;bottom:0;left:18px;width:79px;height:30px;background:#e53935;border-radius:18px 18px 0 0}
.number{
  font-size:clamp(100px,30vw,190px);font-weight:900;line-height:.95;
  margin:5px 0 12px; color:#e91e63; text-shadow:4px 5px 0 #ffd54f;
}
.instruction{font-size:20px;font-weight:bold;margin:4px 0 12px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button{
  border:0;border-radius:18px;padding:15px;font-size:22px;font-weight:bold;
  cursor:pointer;background:#f1f1f1;box-shadow:0 4px 0 #ccc;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #ccc}
.answer.correct{background:#b9f6ca}
.answer.wrong{background:#ffcdd2}
.controls{display:flex;gap:10px;margin-top:14px}
.controls button{flex:1;font-size:17px;background:#fff3cd}
.status{min-height:32px;margin-top:12px;font-size:22px;font-weight:bold}
.score{font-size:17px;color:#666;margin-top:5px}
.start{background:#4caf50;color:white;box-shadow:0 4px 0 #388e3c}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="game">
  <h1>🎯 เกมตัวเลขตามคำสั่ง 1-10</h1>
  <div class="sub">ฟังตัวเลข แล้วเลือกคำตอบให้ถูกต้อง</div>

  <div class="character" aria-label="ตัวการ์ตูนน่ารัก">
    <div class="hair"></div><div class="eye l"></div><div class="eye r"></div>
    <div class="nose"></div><div class="mouth"></div><div class="shirt"></div>
  </div>

  <div id="number" class="number">?</div>
  <div id="instruction" class="instruction">กดเริ่มเกม</div>

  <div id="answers" class="answers hidden"></div>

  <div class="controls">
    <button id="speakBtn" class="hidden">🔊 ฟังอีกครั้ง</button>
  </div>

  <button id="startBtn" class="start">▶️ เริ่มเกม</button>
  <div id="status" class="status"></div>
  <div id="score" class="score">คะแนน 0 / 0</div>
</div>

<script>
const thai = ["ศูนย์","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า","สิบ"];
let target=0, score=0, total=0, locked=true;

const $ = id => document.getElementById(id);
const numberEl=$("number"), instruction=$("instruction"), answers=$("answers");
const statusEl=$("status"), scoreEl=$("score");

function speak(text){
  if(!("speechSynthesis" in window)){ alert("Browser นี้ไม่รองรับเสียงพูด"); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="th-TH"; u.rate=.82; u.pitch=1.05;
  speechSynthesis.speak(u);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function newQuestion(){
  locked=false; statusEl.textContent="";
  target=Math.floor(Math.random()*10)+1;
  numberEl.textContent="?"; 
  instruction.textContent="ฟังเสียง แล้วเลือกตัวเลขที่ได้ยิน";
  answers.innerHTML="";
  
  let opts=new Set([target]);
  while(opts.size<4) opts.add(Math.floor(Math.random()*10)+1);
  
  shuffle([...opts]).forEach(n=>{
    const b=document.createElement("button");
    b.className="answer"; b.textContent=n;
    b.onclick=()=>check(n,b);
    answers.appendChild(b);
  });
  
  answers.classList.remove("hidden");
  $("speakBtn").classList.remove("hidden");
  speak(thai[target]);
}

function check(n,b){
  if(locked)return;
  
  if(n===target){
    locked=true; total++;
    score++; b.classList.add("correct");
    statusEl.textContent="🎉 เก่งมาก!";
    speak("เก่งมาก");
    document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
    scoreEl.textContent=`คะแนน ${score} / ${total}`;
    
    // เลื่อนไปข้อใหม่อัตโนมัติหลังจากผ่านไป 1.2 วินาที
    setTimeout(newQuestion, 1200);
  }else{
    total++;
    b.classList.add("wrong");
    b.disabled = true; // ปิดปุ่มที่ตอบผิดไปเลย จะได้ไม่ต้องกดซ้ำ
    statusEl.textContent="ลองใหม่นะ 😊";
    speak("ลองใหม่");
    scoreEl.textContent=`คะแนน ${score} / ${total}`;
    // ไม่ล็อกเกม ผู้เล่นสามารถเลือกปุ่มอื่นต่อได้ทันที
  }
}

$("startBtn").onclick=()=>{
  score=0; total=0;
  $("startBtn").classList.add("hidden");
  scoreEl.textContent="คะแนน 0 / 0";
  newQuestion();
};
$("speakBtn").onclick=()=>speak(thai[target]);
</script>
</body>
</html>
