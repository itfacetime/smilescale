<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมตัวเลขตามคำสั่ง 1-10 | เกมฝึกคณิตศาสตร์</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap');

*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  /* ใช้ฟอนต์ Sarabun และ TH Sarabun PSK ที่มีหัวและรอยหยักชัดเจน ไม่หนาจนเกินไป */
  font-family:"Sarabun", "TH Sarabun PSK", "Tahoma", sans-serif;
  font-weight: 400;
  background:linear-gradient(135deg,#fff7e6,#ffeef5);
  color:#333;
}
.game{
  width:min(94vw,560px); padding:22px; text-align:center;
  background:#fff; border-radius:28px; box-shadow:0 12px 40px #0002;
}
h1{margin:0 0 5px;font-size:clamp(26px,7vw,40px); font-weight: 600;}
.sub{color:#777;margin-bottom:12px}
.character{
  width:115px;height:115px;margin:8px auto 2px;position:relative;
  background:#ffdca8;border:5px solid #222;border-radius:50%;
  overflow:hidden;
}
.hair{position:absolute;left:0;top:0;width:100%;height:47px;background:#111;
  clip-path:polygon(0 0,100% 0,92% 48%,76% 27%,61% 49%,48% 24%,32% 48%,17% 27%,5% 48%);
}
.eye{position:absolute;top:55px;width:13px;height:18px;background:#111;border-radius:50%}
.eye.l{left:27px}.eye.r{right:27px}
.nose{position:absolute;top:73px;left:51px;width:10px;height:7px;border-radius:50%;background:#e77}
.mouth{position:absolute;top:79px;left:35px;width:45px;height:22px;border-bottom:5px solid #111;border-radius:0 0 50% 50%}
.shirt{position:absolute;bottom:0;left:18px;width:79px;height:30px;background:#e53935;border-radius:18px 18px 0 0}
.number{
  font-size:clamp(90px,25vw,150px);font-weight:900;line-height:.95;
  margin:5px 0 12px; color:#e91e63; text-shadow:4px 5px 0 #ffd54f;
}
.instruction{font-size:22px;font-weight:600;margin:4px 0 12px;white-space:pre-line;}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
button{
  border:0;border-radius:18px;padding:15px;
  /* ขยายตัวเลือกให้ใหญ่ขึ้น ตัวหนังสือชัดเจนและไม่หนาทึบ */
  font-size:28px;
  font-weight:600;
  cursor:pointer;background:#f1f1f1;box-shadow:0 4px 0 #ccc;
  font-family:"Sarabun", "TH Sarabun PSK", "Tahoma", sans-serif;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #ccc}
.answer.correct{background:#b9f6ca}
.answer.wrong{background:#ffcdd2}
.controls{display:flex;gap:10px;margin-top:14px}
.status{min-height:32px;margin-top:12px;font-size:22px;font-weight:600}
.score{font-size:18px;color:#666;margin-top:5px}
.start{background:#4caf50;color:white;box-shadow:0 4px 0 #388e3c;font-size:24px;padding:15px 30px;width:100%;margin-top:15px;font-weight:600;}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="game">
  <h1>🎯 เกมตัวเลขตามคำสั่ง 1-10</h1>
  <div class="sub">ทั้งหมด 20 ข้อ ฟังตัวเลข แล้วเลือกคำตอบให้ถูกต้อง</div>

  <div class="character" aria-label="ตัวการ์ตูนน่ารัก">
    <div class="hair"></div><div class="eye l"></div><div class="eye r"></div>
    <div class="nose"></div><div class="mouth"></div><div class="shirt"></div>
  </div>

  <div id="number" class="number">?</div>
  <div id="instruction" class="instruction">กดเริ่มเกมเพื่อสนุกกันเลย!</div>

  <div id="answers" class="answers hidden"></div>

  <div class="controls" style="display: flex; justify-content: flex-end;"> 
       <button id="speakBtn" class="hidden" style="font-size:18px; padding:10px 15px;">🔊 ฟังอีกครั้ง</button> 
  </div>

  <button id="startBtn" class="start">▶️ เริ่มเกม</button>
  <div id="status" class="status"></div>
  <div id="score" class="score"></div>
</div>

<script>
const thai = ["ศูนย์","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า","สิบ"];
let target=0, score=0, currentQ=0, maxQ=20, locked=true;

const $ = id => document.getElementById(id);
const numberEl=$("number"), instruction=$("instruction"), answers=$("answers");
const statusEl=$("status"), scoreEl=$("score");

function speak(text){
  if(!("speechSynthesis" in window)){ alert("Browser นี้ไม่รองรับเสียงพูด"); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="th-TH"; u.rate=.82; u.pitch=1.05;
  speechSynthesis.speak(u);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function newQuestion(){
  if(currentQ >= maxQ){
    endGame();
    return;
  }
  
  locked=false; statusEl.textContent="";
  target=Math.floor(Math.random()*10)+1;
  numberEl.textContent="?"; 
  instruction.textContent=`ข้อที่ ${currentQ + 1} / ${maxQ}\nฟังเสียง แล้วเลือกตัวเลขที่ได้ยิน`;
  answers.innerHTML="";
  
  let opts=new Set([target]);
  while(opts.size<4) opts.add(Math.floor(Math.random()*10)+1);
  
  shuffle([...opts]).forEach(n=>{
    const b=document.createElement("button");
    b.className="answer"; b.textContent=n;
    b.onclick=()=>check(n,b);
    answers.appendChild(b);
  });
  
  answers.classList.remove("hidden");
  $("speakBtn").classList.remove("hidden");
  speak(thai[target]);
}

function check(n,b){
  if(locked)return;
  
  if(n===target){
    locked=true; 
    score++; 
    currentQ++;
    b.classList.add("correct");
    statusEl.textContent="🎉 เก่งมาก!";
    speak("เก่งมาก");
    document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
    scoreEl.textContent=`คะแนนรวม: ${score} / ${maxQ}`;
    
    setTimeout(() => {
      if(currentQ >= maxQ){
        endGame();
      } else {
        newQuestion();
      }
    }, 2200);
  }else{
    b.classList.add("wrong");
    b.disabled = true; 
    statusEl.textContent="ลองใหม่นะ 😊";
    speak("ลองใหม่");
  }
}

function endGame(){
  locked = true;
  answers.classList.add("hidden");
  $("speakBtn").classList.add("hidden");
  numberEl.textContent = "🏆";
  
  let message = "";
  let speechText = "";
  
  if(score === maxQ){
    message = `🎉 ยินดีด้วย! คุณได้ ${score} / ${maxQ} คะแนน\nสุดยอดไปเลย!`;
    speechText = "สุดยอดไปเลย";
  } else {
    message = `🌟 คุณได้ ${score} / ${maxQ} คะแนน\nคุณทำได้ดีแล้ว สู้ ๆ ค่ะ`;
    speechText = "คุณทำได้ดีแล้ว สู้ ๆ ค่ะ";
  }
  
  instruction.textContent = message;
  statusEl.textContent = "";
  scoreEl.textContent = "";
  $("startBtn").textContent = "🔄 เล่นใหม่อีกครั้ง";
  $("startBtn").classList.remove("hidden");
  speak(speechText);
}

$("startBtn").onclick=()=>{
  score=0; 
  currentQ=0;
  $("startBtn").classList.add("hidden");
  scoreEl.textContent=`คะแนนรวม: 0 / ${maxQ}`;
  newQuestion();
};

$("speakBtn").onclick=()=>speak(thai[target]);
</script>
</body>
</html>
