<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมกากบาทตัวอักษร A-Z (ออกเสียงตัวอักษรทันที)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-200 to-yellow-200 flex items-center justify-center min-h-screen p-3">
    <!-- กรอบหลักขนาดใหญ่เต็มมือถือ -->
    <div class="bg-white rounded-3xl shadow-2xl p-5 w-full max-w-lg text-center relative">
        <!-- ไอคอนตกแต่ง -->
        <div class="text-5xl mb-1">❌🔤</div>
        
        <!-- หัวข้อเกมและสถานะข้อ -->
        <h2 class="text-2xl font-bold text-indigo-600 mb-1">เกมกากบาทตัวอักษร A-Z</h2>
        <div class="flex justify-between items-center px-2 text-lg text-blue-600 font-semibold mb-2">
            <span id="question-tracker">ข้อที่: 1 / 30</span>
            <span>⭐ คะแนน: <span id="score">0</span></span>
        </div>
        
        <p class="text-lg font-semibold text-gray-800 mb-2">ฟังเสียงแล้วกากบาทตัวอักษรนั้น</p>
        
        <!-- ปุ่มกดฟังเสียงซ้ำ -->
        <button onclick="speakQuestion()" class="mb-4 bg-indigo-100 text-indigo-700 px-6 py-2.5 rounded-full text-base font-bold hover:bg-indigo-200 transition shadow-md active:scale-95">
            🔊 ฟังเสียงอีกครั้ง
        </button>

        <!-- พื้นที่แสดงตัวอักษรตัวเลือก (ขนาดใหญ่สะใจ) -->
        <div id="grid-container" class="grid grid-cols-5 gap-3 mb-4 p-3 bg-gray-50 rounded-2xl min-h-[260px] items-center justify-center">
            <!-- สร้างปุ่มตัวเลือกตัวอักษรด้วย JavaScript -->
        </div>
        
        <!-- คะแนนดาวด้านล่าง -->
        <div class="flex justify-center gap-2 text-2xl">⭐ ⭐ ⭐</div>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 30;
        let score = 0;
        let targetLetter = '';
        let englishVoice = null;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            englishVoice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en-GB') && (v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Victoria'))) || voices.find(v => v.lang.includes('en'));
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function speakText(text, lang = 'en-US', isEnglish = true) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;

                if (isEnglish && englishVoice) {
                    utterance.voice = englishVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        // ฟังก์ชันออกเสียงเฉพาะตัวอักษรเป้าหมายทันที
        function speakQuestion() {
            speakText(targetLetter, 'en-US', true);
        }

        function nextQuestion() {
            if (currentQuestion > totalQuestions) {
                // เปลี่ยนเสียงพูดสรุปผลเป็นไทย (เพราะไม่ใช่ตัวอักษร A-Z)
                speakText(`จบเกมแล้วครับ คุณได้คะแนน ${score} คะแนน จาก 30 คะแนน`, 'th-TH', false);
                alert(`🎉 จบเกมแล้ว! คุณได้คะแนน ${score} / 30 คะแนน`);
                currentQuestion = 1;
                score = 0;
            }

            document.getElementById('question-tracker').innerText = `ข้อที่: ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('score').innerText = score;

            targetLetter = alphabet[Math.floor(Math.random() * alphabet.length)];

            let choices = [targetLetter];
            while (choices.length < 10) {
                let randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!choices.includes(randomChar)) {
                    choices.push(randomChar);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            
            choices.forEach(char => {
                const btn = document.createElement('button');
                btn.className = `bg-white border-2 border-indigo-200 text-indigo-700 font-extrabold text-3xl py-5 rounded-2xl shadow-md hover:bg-indigo-50 active:scale-95 transition-all flex items-center justify-center relative`;
                btn.innerText = char;
                
                btn.onclick = () => {
                    if (char === targetLetter) {
                        btn.innerHTML = `<span class="text-4xl text-red-500 font-bold">❌</span>`;
                        btn.className = `bg-red-50 border-2 border-red-300 font-bold py-5 rounded-2xl shadow-md flex items-center justify-center`;
                        score += 1;
                        speakText('Correct', 'en-US', true); // เปลี่ยนเป็นพูดภาษาอังกฤษสั้นๆ หรือเอาออกได้ตามชอบ
                        
                        disableAllButtons(true);
                        currentQuestion++;
                        setTimeout(nextQuestion, 1200);
                    } else {
                        btn.innerHTML = `<span class="text-3xl text-gray-400">❌</span>`;
                        speakText('Try again', 'en-US', true);
                    }
                };
                gridContainer.appendChild(btn);
            });

            // ออกเสียงตัวอักษรทันทีเมื่อเปลี่ยนข้อ
            setTimeout(speakQuestion, 400);
        }

        function disableAllButtons(disable) {
            const buttons = document.querySelectorAll('#grid-container button');
            buttons.forEach(btn => btn.disabled = disable);
        }

        window.onload = () => {
            setTimeout(loadVoices, 200);
            nextQuestion();
        };
    </script>
</body>
</html>
