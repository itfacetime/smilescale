<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เกมกากบาทตัวอักษร A-Z (เสียงเจ้าของภาษา)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-200 to-yellow-200 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-3xl shadow-xl p-6 w-full max-w-md text-center relative">
        <!-- ไอคอนตกแต่ง -->
        <div class="text-4xl mb-2">❌🔤</div>
        
        <!-- หัวข้อเกมและสถานะข้อ -->
        <h2 class="text-xl font-bold text-indigo-600 mb-1">เกมกากบาทตัวอักษร A-Z</h2>
        <div class="flex justify-between items-center px-4 text-blue-500 font-semibold mb-2">
            <span id="question-tracker">ข้อที่: 1 / 30</span>
            <span>⭐ คะแนน: <span id="score">0</span></span>
        </div>
        
        <p class="font-semibold text-gray-800 mb-2">จงหากากบาททับตัวอักษรตามเสียงที่ได้ยิน</p>
        
        <!-- ปุ่มกดฟังเสียงโจทย์ซ้ำ -->
        <button onclick="speakQuestion()" class="mb-4 bg-indigo-100 text-indigo-600 px-4 py-1.5 rounded-full text-sm font-semibold hover:bg-indigo-200 transition shadow-sm">
            🔊 ฟังเสียงอีกครั้ง
        </button>

        <!-- พื้นที่แสดงตัวอักษรตัวเลือก -->
        <div id="grid-container" class="grid grid-cols-5 gap-2 mb-6 p-2 bg-gray-50 rounded-2xl min-h-[180px] items-center justify-center">
            <!-- สร้างปุ่มตัวเลือกตัวอักษรด้วย JavaScript -->
        </div>
        
        <!-- คะแนนดาวด้านล่าง -->
        <div class="flex justify-center gap-1 text-xl">⭐ ⭐ ⭐</div>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 30;
        let score = 0;
        let targetLetter = '';
        let englishVoice = null;

        // รายการตัวอักษรภาษาอังกฤษพิมพ์ใหญ่ A-Z
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        // โหลดเสียงในระบบ และเลือกเสียงผู้หญิงภาษาอังกฤษ (en-US หรือ en-GB ที่เป็น Female)
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // พยายามหาเสียงผู้หญิงภาษาอังกฤษ (มักจะมีคำว่า Female, Google US English, Samantha, Victoria เป็นต้น)
            englishVoice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en-GB') && (v.name.includes('Female') || v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Victoria'))) || voices.find(v => v.lang.includes('en'));
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // ฟังก์ชันสั่งพูด
        function speakText(text, lang = 'th-TH', isEnglish = false) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85; // ความเร็วพอดี ฟังชัดเจน

                // ถ้าระบุว่าเป็นภาษาอังกฤษ ให้ใช้เสียงเจ้าของภาษาที่ค้นพบ
                if (isEnglish && englishVoice) {
                    utterance.voice = englishVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        function speakQuestion() {
            // อ่านคำสั่งไทยก่อน แล้วตามด้วยเสียงภาษาอังกฤษแบบเจ้าของภาษา
            speakText('หากากบาททับตัวอักษร', 'th-TH', false);
            setTimeout(() => {
                speakText(targetLetter, 'en-US', true);
            }, 900);
        }

        // เริ่มต้นข้อใหม่
        function nextQuestion() {
            if (currentQuestion > totalQuestions) {
                speakText(`จบเกมแล้วครับ คุณได้คะแนน ${score} คะแนน จาก 30 คะแนน`, 'th-TH', false);
                alert(`🎉 จบเกมแล้ว! คุณได้คะแนน ${score} / 30 คะแนน`);
                currentQuestion = 1;
                score = 0;
            }

            document.getElementById('question-tracker').innerText = `ข้อที่: ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('score').innerText = score;

            // สุ่มตัวอักษรเป้าหมาย 1 ตัวจาก A-Z
            targetLetter = alphabet[Math.floor(Math.random() * alphabet.length)];

            // สุ่มตัวอักษรทั้งหมด 10 ตัวเลือกมาแสดงในตาราง
            let choices = [targetLetter];
            while (choices.length < 10) {
                let randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!choices.includes(randomChar)) {
                    choices.push(randomChar);
                }
            }
            // สลับตำแหน่งปุ่มในตาราง
            choices.sort(() => Math.random() - 0.5);

            // สร้างปุ่มตารางตัวอักษร
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            
            choices.forEach(char => {
                const btn = document.createElement('button');
                btn.className = `bg-white border-2 border-indigo-200 text-indigo-700 font-bold text-xl py-3 rounded-xl shadow hover:bg-indigo-50 active:scale-95 transition-all flex items-center justify-center relative`;
                btn.innerText = char;
                
                btn.onclick = () => {
                    if (char === targetLetter) {
                        btn.innerHTML = `<span class="text-2xl text-red-500">❌</span>`;
                        btn.className = `bg-red-50 border-2 border-red-300 font-bold text-xl py-3 rounded-xl shadow flex items-center justify-center`;
                        score += 1;
                        speakText('ถูกต้องครับ เก่งมาก', 'th-TH', false);
                        
                        disableAllButtons(true);
                        currentQuestion++;
                        setTimeout(nextQuestion, 1200);
                    } else {
                        btn.innerHTML = `<span class="text-xl text-gray-400">❌</span>`;
                        speakText('ลองใหม่อีกครั้งครับ', 'th-TH', false);
                    }
                };
                gridContainer.appendChild(btn);
            });

            // ออกเสียงโจทย์อัตโนมัติ
            setTimeout(speakQuestion, 400);
        }

        function disableAllButtons(disable) {
            const buttons = document.querySelectorAll('#grid-container button');
            buttons.forEach(btn => btn.disabled = disable);
        }

        // เริ่มเกมข้อแรกเมื่อโหลดหน้าเว็บ
        window.onload = () => {
            setTimeout(loadVoices, 200);
            nextQuestion();
        };
    </script>
</body>
</html>
