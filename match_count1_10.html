<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เกมส์นับเลข 1 - 10 (เปลี่ยนรูปได้ พร้อมเสียงพูด)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 to-blue-200 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-3xl shadow-xl p-6 w-full max-w-lg text-center relative">
        <!-- ไอคอนกระต่าย -->
        <div class="text-4xl mb-2">🐰</div>
        
        <!-- หัวข้อเกมและสถานะข้อ -->
        <h2 class="text-xl font-bold text-red-500 mb-1">เกมส์นับเลข 1 - 10</h2>
        <div class="flex justify-between items-center px-4 text-blue-500 font-semibold mb-2">
            <span id="question-tracker">ข้อที่: 1 / 30</span>
            <span>⭐ คะแนน: <span id="score">0</span></span>
        </div>
        
        <p class="font-semibold text-gray-800 mb-4" id="question-text">รูปนี้มีกี่ลูก?</p>
        
        <!-- ปุ่มกดฟังเสียงโจทย์ซ้ำ -->
        <button onclick="speakQuestion()" class="mb-4 bg-indigo-100 text-indigo-600 px-4 py-1.5 rounded-full text-sm font-semibold hover:bg-indigo-200 transition">
            🔊 ฟังเสียงโจทย์
        </button>

        <!-- พื้นที่แสดงรูปภาพ -->
        <div id="fruit-container" class="flex flex-wrap items-center justify-center gap-2 min-h-[90px] max-h-[120px] overflow-y-auto mb-6 px-2">
            <!-- แสดงรูปตามโจทย์ -->
        </div>
        
        <!-- ปุ่มตัวเลือก 1 - 10 -->
        <div class="grid grid-cols-5 gap-2 mb-4" id="choice-buttons"></div>
        
        <!-- คะแนนดาวด้านล่าง -->
        <div class="flex justify-center gap-1 text-xl">⭐ ⭐ ⭐</div>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 30;
        let score = 0;
        let currentAnswer = 0;
        let currentFruitName = 'ส้ม';

        // รายการผลไม้และชื่อเรียกภาษาไทยสำหรับให้เสียงพูดอ่าน
        const fruits = [
            { emoji: '🍊', name: 'ส้ม' },
            { emoji: '🍎', name: 'แอปเปิ้ล' },
            { emoji: '🍌', name: 'กล้วย' },
            { emoji: '🍓', name: 'สตรอว์เบอร์รี' },
            { emoji: '🍇', name: 'องุ่น' },
            { emoji: '🍉', name: 'แตงโม' },
            { emoji: '🍑', name: 'ลูกพีช' }
        ];

        const colors = ['bg-red-400', 'bg-blue-400', 'bg-green-400', 'bg-amber-400', 'bg-purple-400', 'bg-pink-400', 'bg-teal-400', 'bg-indigo-400', 'bg-orange-400', 'bg-cyan-400'];

        // ฟังก์ชันสั่งให้เบราว์เซอร์พูดภาษาไทย
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakQuestion() {
            speakText(`รูปนี้ มี ${currentFruitName} ทั้งหมด ${currentAnswer} ลูก`);
        }

        // เริ่มต้นข้อใหม่
        function nextQuestion() {
            if (currentQuestion > totalQuestions) {
                speakText(`จบเกมแล้วครับ คุณได้คะแนน ${score} คะแนน จาก 30 คะแนน`);
                alert(`🎉 จบเกมแล้ว! คุณได้คะแนน ${score} / 30 คะแนน`);
                currentQuestion = 1;
                score = 0;
            }

            document.getElementById('question-tracker').innerText = `ข้อที่: ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('score').innerText = score;

            // สุ่มจำนวนผลไม้ 1 - 10
            currentAnswer = Math.floor(Math.random() * 10) + 1;

            // สุ่มชนิดผลไม้
            const randomFruit = fruits[Math.floor(Math.random() * fruits.length)];
            currentFruitName = randomFruit.name;

            document.getElementById('question-text').innerText = `รูป ${currentFruitName} นี้มีกี่ลูก?`;

            // แสดงผลไม้ตามจำนวนที่สุ่ม
            const container = document.getElementById('fruit-container');
            container.innerHTML = '';
            for (let i = 0; i < currentAnswer; i++) {
                const span = document.createElement('span');
                span.className = 'text-3xl animate-bounce';
                span.innerText = randomFruit.emoji;
                container.appendChild(span);
            }

            // อ่านโจทย์ออกเสียงอัตโนมัติ
            setTimeout(speakQuestion, 500);
        }

        // สร้างปุ่มตัวเลือก 1-10
        const choiceContainer = document.getElementById('choice-buttons');
        for (let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.className = `${colors[i-1]} text-white font-bold py-3 rounded-xl text-lg shadow hover:opacity-95 active:scale-95 transition-transform`;
            btn.innerText = i;
            btn.onclick = () => {
                if (i === currentAnswer) {
                    score += 1;
                    speakText('ถูกต้องครับ เก่งมาก');
                } else {
                    speakText(`ผิดครับ คำตอบที่ถูกต้องคือ ${currentAnswer}`);
                }
                currentQuestion++;
                setTimeout(nextQuestion, 1200);
            };
            choiceContainer.appendChild(btn);
        }

        // เริ่มเกมข้อแรก
        window.onload = () => {
            nextQuestion();
        };
    </script>
</body>
</html>
