<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่พยัญชนะกับภาพ ก-ถ (ตัวอักษรใหญ่พิเศษ)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- นำเข้าฟอนต์ TH Sarabun New และฟอนต์เสริมโครงสร้างภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:wght@700&family=K2D:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'K2D', 'TH Sarabun New', sans-serif; 
        }
        /* คลาสสำหรับตัวพยัญชนะ: ใช้ TH Sarabun New และปรับขนาดให้ใหญ่พิเศษ เห็นหัวและรอยหยักชัดเจน */
        .thai-char {
            font-family: 'TH Sarabun New', 'K2D', sans-serif;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-200 to-sky-200 flex items-center justify-center min-h-screen p-3">
    <!-- กรอบหลักขนาดใหญ่เต็มมือถือ -->
    <div class="bg-white rounded-3xl shadow-2xl p-5 w-full max-w-lg text-center relative">
        <!-- ไอคอนตกแต่ง -->
        <div class="text-4xl mb-1">🎨🐰</div>
        
        <!-- หัวข้อเกมและสถานะข้อ -->
        <h2 class="text-xl font-bold text-sky-600 mb-1">เกมจับคู่พยัญชนะกับภาพ ก-ถ</h2>
        <div class="flex justify-between items-center px-2 text-base text-blue-600 font-semibold mb-2">
            <span id="question-tracker">ข้อที่: 1 / 30</span>
            <span>⭐ คะแนน: <span id="score">0</span></span>
        </div>
        
        <p class="text-base font-semibold text-gray-800 mb-2">รูปนี้ตรงกับพยัญชนะตัวไหน?</p>

        <!-- พื้นที่แสดงรูปภาพโจทย์ (ขนาดใหญ่ ชัดเจน เข้าใจง่ายสำหรับเด็ก) -->
        <div class="mb-4 bg-sky-50 border-4 border-sky-200 rounded-2xl py-4 flex flex-col items-center justify-center shadow-inner">
            <div id="question-emoji" class="text-8xl mb-1 animate-bounce">🐔</div>
            <div id="question-name" class="text-xl font-bold text-sky-800">ไก่</div>
        </div>

        <!-- พื้นที่แสดงพยัญชนะตัวเลือก 5 ตัว (ขยายตัวอักษรใหญ่สุดขีด text-7xl) -->
        <div id="grid-container" class="grid grid-cols-5 gap-2 mb-4 p-2 bg-gray-50 rounded-2xl min-h-[160px] items-center justify-center">
            <!-- สร้างปุ่มตัวเลือกพยัญชนะด้วย JavaScript -->
        </div>

        <!-- คะแนนดาวด้านล่าง -->
        <div class="flex justify-center gap-2 text-xl">⭐ ⭐ ⭐</div>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 30;
        let score = 0;
        let targetObj = {};

        // ฐานข้อมูลพยัญชนะ ก - ถ พร้อมภาพที่เด็กเข้าใจง่าย
        const thaiData = [
            { char: "ก", emoji: "🐔", name: "ไก่" },
            { char: "ข", emoji: "🥚", name: "ไข่" },
            { char: "ฃ", emoji: "🏺", name: "ขวด" },
            { char: "ค", emoji: "🐃", name: "ควาย" },
            { char: "ฅ", emoji: "👨", name: "คน" },
            { char: "ฆ", emoji: "🔔", name: "ระฆัง" },
            { char: "ง", emoji: "🐍", name: "งู" },
            { char: "จ", emoji: "🥣", name: "จาน" },
            { char: "ฉ", emoji: "🥢", name: "ฉิ่ง" },
            { char: "ช", emoji: "🐘", name: "ช้าง" },
            { char: "ซ", emoji: "⛓️", name: "โซ่" },
            { char: "ฌ", emoji: "🌳", name: "ต้นไม้ (เฌอ)" },
            { char: "ญ", emoji: "👸", name: "ผู้หญิง" },
            { char: "ฎ", emoji: "👑", name: "ชฎา" },
            { char: "ฏ", emoji: "🔱", name: "ปฏัก" },
            { char: "ฐ", emoji: "🏛️", name: "ฐาน" },
            { char: "ฑ", emoji: "👼", name: "มณโฑ" },
            { char: "ฒ", emoji: "👴", name: "ผู้เฒ่า" },
            { char: "ณ", emoji: "🧙‍♂️", name: "เณร" },
            { char: "ด", emoji: "👶", name: "เด็ก" },
            { char: "ต", emoji: "🐢", name: "เต่า" },
            { char: "ถ", emoji: "🛍️", name: "ถุง" }
        ];

        // ฟังก์ชันสำหรับพูดเสียงภาษาไทย
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.9; // ความเร็วพอดี ฟังชัดเจน
                window.speechSynthesis.speak(utterance);
            }
        }

        function nextQuestion() {
            if (currentQuestion > totalQuestions) {
                speakText("เก่งมากค่ะ จบเกมแล้ว");
                alert(`🎉 เก่งมากจ้า! จบเกมแล้ว ได้คะแนน ${score} / 30 คะแนน`);
                currentQuestion = 1;
                score = 0;
            }

            document.getElementById('question-tracker').innerText = `ข้อที่: ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('score').innerText = score;

            // สุ่มโจทย์จากข้อมูล ก - ถ
            targetObj = thaiData[Math.floor(Math.random() * thaiData.length)];

            // แสดงรูปและชื่อสิ่งของ
            document.getElementById('question-emoji').innerText = targetObj.emoji;
            document.getElementById('question-name').innerText = targetObj.name;

            // สุ่มตัวเลือก 5 ตัว (รวมตัวที่ถูกต้อง)
            let choices = [targetObj];
            while (choices.length < 5) {
                let randomItem = thaiData[Math.floor(Math.random() * thaiData.length)];
                if (!choices.some(item => item.char === randomItem.char)) {
                    choices.push(randomItem);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            
            choices.forEach(item => {
                const btn = document.createElement('button');
                // ใช้คลาส thai-char และขยายขนาดตัวอักษรเป็น text-7xl เพื่อให้ตัวพยัญชนะใหญ่สะใจและเห็นโครงสร้างชัดเจน
                btn.className = `bg-white border-2 border-sky-300 text-sky-950 thai-char text-7xl py-4 rounded-2xl shadow-md hover:bg-sky-50 active:scale-95 transition-all flex items-center justify-center relative`;
                btn.innerText = item.char;
                
                btn.onclick = () => {
                    if (item.char === targetObj.char) {
                        btn.innerHTML = `<span class="text-7xl text-red-500 font-bold">❌</span>`;
                        btn.className = `bg-red-50 border-2 border-red-300 font-bold py-4 rounded-2xl shadow-md flex items-center justify-center`;
                        score += 1;
                        
                        speakText("ถูกต้องค่ะ");
                        
                        disableAllButtons(true);
                        currentQuestion++;
                        setTimeout(nextQuestion, 1200);
                    } else {
                        btn.innerHTML = `<span class="text-6xl text-gray-400">❌</span>`;
                        speakText("ลองใหม่ค่ะ");
                    }
                };
                gridContainer.appendChild(btn);
            });
        }

        function disableAllButtons(disable) {
            const buttons = document.querySelectorAll('#grid-container button');
            buttons.forEach(btn => btn.disabled = disable);
        }

        window.onload = () => {
            nextQuestion();
        };
    </script>
</body>
</html>
