<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมเจ้าหญิงนับเลข 1-5</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    text-align:center;
    background:linear-gradient(180deg,#87CEFA,#FFE4F2);
}

header{
    background:#ff69b4;
    color:white;
    padding:15px;
    font-size:2rem;
    font-weight:bold;
}

#score{
    margin-top:10px;
    font-size:1.4rem;
    font-weight:bold;
    color:#1565c0;
}

#princess-area{
    margin:15px;
}

#princess{
    font-size:120px;
    transition:.5s;
}

#princess-text{
    color:#e91e63;
    font-weight:bold;
    font-size:1.1rem;
}

.princess-animation{
    animation:spinPrincess .8s;
}

@keyframes spinPrincess{
    0%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.3) rotate(10deg);}
    100%{transform:scale(1) rotate(0deg);}
}

#question{
    font-size:2rem;
    margin-top:10px;
}

#displayArea{
    min-height:140px;
    margin:25px;
    font-size:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
}

.choice-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    padding:10px;
}

.choice{
    min-width:90px;
    min-height:90px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:2rem;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    transition:.2s;
}

.choice:hover{
    transform:scale(1.08);
}

.c1{background:#f44336;color:white;}
.c2{background:#ff9800;color:white;}
.c3{background:#4caf50;color:white;}
.c4{background:#2196f3;color:white;}
.c5{background:#9c27b0;color:white;}

#message{
    min-height:50px;
    font-size:2rem;
    font-weight:bold;
    margin-top:10px;
}

.correct{color:green;}
.wrong{color:red;}

#restart{
    margin:20px;
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#009688;
    color:white;
    font-size:1.2rem;
    cursor:pointer;
}

.flash{
    animation:flash .8s;
}

@keyframes flash{
    from{background:#fff59d;}
    to{background:transparent;}
}
</style>

</head>

<body>

<header>👸 เกมเจ้าหญิงนับเลข 1-5 👸</header>

<div id="score">คะแนน : 0</div>

<div id="princess-area">
    <div id="princess">👸</div>
    <div id="princess-text">เจ้าหญิงกำลังรอชุดใหม่</div>
</div>

<div id="question"></div>

<div id="displayArea"></div>

<div id="choices" class="choice-container"></div>

<div id="message"></div>

<button id="restart" onclick="restartGame()">
🔄 เริ่มใหม่
</button>

<script>

let score=0;
let answer=1;

const thaiWords={
1:"หนึ่ง",
2:"สอง",
3:"สาม",
4:"สี่",
5:"ห้า"
};

const icons=[
"🐶","🐱","🐰","🐸","🐼",
"🦁","🐯","🍎","🍌",
"⚽","🌟","🎈"
];

const princessStyles=[
{emoji:"👸",text:"ชุดเจ้าหญิงคลาสสิก"},
{emoji:"👸👑",text:"ชุดราชินี"},
{emoji:"👸🎀",text:"ชุดโบว์สีชมพู"},
{emoji:"👸💎",text:"ชุดเพชร"},
{emoji:"👸🌸",text:"ชุดดอกไม้"},
{emoji:"👸🦋",text:"ชุดผีเสื้อ"},
{emoji:"👸✨",text:"ชุดงานเลี้ยง"},
{emoji:"👸🩷",text:"ชุดสีชมพู"},
{emoji:"👸❄️",text:"ชุดเจ้าหญิงน้ำแข็ง"},
{emoji:"👸🏰",text:"ชุดแห่งปราสาท"}
];

function speak(text){
    if(!window.speechSynthesis) return;

    speechSynthesis.cancel();

    const msg=
    new SpeechSynthesisUtterance(text);

    msg.lang="th-TH";
    msg.rate=0.9;

    speechSynthesis.speak(msg);
}

function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

function randomIcon(){
    return icons[
        Math.floor(Math.random()*icons.length)
    ];
}

function updateScore(){
    document.getElementById("score").innerHTML=
    "คะแนน : "+score;
}

function changePrincess(){

    const style=
    princessStyles[
        Math.floor(
            Math.random()*princessStyles.length
        )
    ];

    const p=
    document.getElementById("princess");

    p.innerHTML=style.emoji;

    document.getElementById(
        "princess-text"
    ).innerHTML=
    "🎁 ปลดล็อก: "+style.text;

    p.classList.remove(
        "princess-animation"
    );

    void p.offsetWidth;

    p.classList.add(
        "princess-animation"
    );
}

function countMode(){

    answer=
    Math.floor(Math.random()*5)+1;

    let icon=randomIcon();

    let html="";

    for(let i=0;i<answer;i++){
        html+=icon;
    }

    document.getElementById(
        "question"
    ).innerHTML=
    "นับรูปแล้วเลือกตัวเลข";

    document.getElementById(
        "displayArea"
    ).innerHTML=html;

    let numbers=[1,2,3,4,5];
    shuffle(numbers);

    let buttons="";

    numbers.forEach(n=>{
        buttons+=`
        <button class="choice c${n}"
        onclick="checkAnswer(${n})">
        ${n}
        </button>`;
    });

    document.getElementById(
        "choices"
    ).innerHTML=buttons;

    setTimeout(()=>{
        speak(thaiWords[answer]);
    },500);
}

function pictureMode(){

    answer=
    Math.floor(Math.random()*5)+1;

    document.getElementById(
        "question"
    ).innerHTML=
    "เลือกจำนวนรูปให้ตรงกับเลข";

    document.getElementById(
        "displayArea"
    ).innerHTML=
    "<div style='font-size:120px'>"+
    answer+"</div>";

    let icon=randomIcon();

    let options=[];

    for(let i=1;i<=5;i++){

        let row="";

        for(let j=0;j<i;j++){
            row+=icon;
        }

        options.push({
            value:i,
            text:row
        });
    }

    shuffle(options);

    let html="";

    options.forEach(opt=>{

        html+=`
        <button class="choice"
        style="font-size:34px"
        onclick="checkAnswer(${opt.value})">
        ${opt.text}
        </button>`;
    });

    document.getElementById(
        "choices"
    ).innerHTML=html;

    setTimeout(()=>{
        speak(thaiWords[answer]);
    },500);
}

function nextQuestion(){

    document.getElementById(
        "message"
    ).innerHTML="";

    if(Math.random()<0.5){
        countMode();
    }else{
        pictureMode();
    }
}

function checkAnswer(choice){

    let msg=
    document.getElementById("message");

    if(choice===answer){

        score++;
        updateScore();

        changePrincess();

        msg.className="correct";
        msg.innerHTML=
        "🎉 ถูกต้อง เก่งมาก";

        speak("ถูกต้อง");

        document.body.classList.add("flash");

        setTimeout(()=>{
            document.body.classList.remove("flash");
        },800);

        setTimeout(
            nextQuestion,
            1500
        );

    }else{

        msg.className="wrong";
        msg.innerHTML=
        "❌ ลองใหม่";

        speak("ลองใหม่");
    }
}

function restartGame(){

    score=0;

    updateScore();

    document.getElementById(
        "princess"
    ).innerHTML="👸";

    document.getElementById(
        "princess-text"
    ).innerHTML=
    "เจ้าหญิงกำลังรอชุดใหม่";

    nextQuestion();
}

nextQuestion();

</script>

</body>
</html>
