<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตัวอักษรตามคำสั่งเสียง A-Z (5 ตัวเลือก เสียงไทยชัดเจน)</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* สไตล์หลักและการจัดวาง (แทนที่ Tailwind CSS เพื่อความเสถียร 100%) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, #c7d2fe 0%, #fef08a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: min-content;
            height: 100vh;
            padding: 12px;
        }
        .game-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 24px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .emoji-header {
            font-size: 3rem;
            margin-bottom: 4px;
        }
        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 8px;
        }
        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            font-size: 1.125rem;
            color: #2563eb;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .game-instruction {
            font-size: 1.125rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
        }
        .audio-btn {
            background-color: #e0e7ff;
            color: #4338ca;
            border: none;
            padding: 10px 24px;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .audio-btn:hover {
            background-color: #c7d2fe;
        }
        .audio-btn:active {
            transform: scale(0.95);
        }
        .grid-container {
            display: grid;
            grid-template-cols: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            padding: 16px;
            background-color: #f9fafb;
            border-radius: 16px;
            min-height: 120px;
            align-items: center;
            justify-content: center;
        }
        /* รูปแบบตัวอักษรแบบพจนานุกรมและหนาปกติ */
        .choice-btn {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 400;
            font-size: 1.875rem;
            background-color: #ffffff;
            border: 2px solid #e0e7ff;
            color: #4338ca;
            padding: 16px 0;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .choice-btn:hover:not(:disabled) {
            background-color: #f5f3ff;
        }
        .choice-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .choice-btn:disabled {
            cursor: default;
        }
        .choice-correct {
            background-color: #fef2f2;
            border-color: #fca5a5;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 0;
            border-radius: 16px;
        }
        .stars-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- กรอบหลักขนาดใหญ่ สไตล์การ์ดโค้งมนเด่นชัด -->
    <div class="game-card">
        <div class="emoji-header">❌🔤</div>
        
        <h2 class="game-title">เกมตัวอักษรตามคำสั่งเสียง A-Z</h2>
        <div class="status-container">
            <span id="question-tracker">ข้อที่: 1 / 30</span>
            <span>⭐ คะแนน: <span id="score">0</span></span>
        </div>
        
        <p class="game-instruction">ฟังเสียงแล้วกากบาทตัวอักษรนั้น</p>
        
        <button onclick="speakQuestion()" class="audio-btn">
            🔊 ฟังเสียงอีกครั้ง
        </button>

        <!-- พื้นที่ตัวเลือก 5 ตัวอักษรเรียงตัวสวยงามพอดีแถว -->
        <div id="grid-container" class="grid-container">
            <!-- สร้างปุ่มตัวเลือกตัวอักษรด้วย JavaScript -->
        </div>
        
        <div class="stars-container">⭐ ⭐ ⭐</div>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 30;
        let score = 0;
        let targetLetter = '';

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH'; 
                utterance.rate = 0.9; 
                window.speechSynthesis.speak(utterance);
            }
        }

        // พูดออกเสียงเฉพาะตัวอักษรเป้าหมายเท่านั้นตามบรีฟ
        function speakQuestion() {
            speakText(targetLetter);
        }

        function nextQuestion() {
            if (currentQuestion > totalQuestions) {
                speakText(`จบเกมแล้วค่ะ คุณได้รับคะแนนทั้งหมด ${score} คะแนน จาก 30 คะแนน เก่งมากค่ะ`);
                alert(`🎉 จบเกมแล้ว! คุณได้คะแนน ${score} / 30 คะแนน`);
                currentQuestion = 1;
                score = 0;
            }

            document.getElementById('question-tracker').innerText = `ข้อที่: ${currentQuestion} / ${totalQuestions}`;
            document.getElementById('score').innerText = score;

            targetLetter = alphabet[Math.floor(Math.random() * alphabet.length)];

            let choices = [targetLetter];
            while (choices.length < 5) {
                let randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!choices.includes(randomChar)) {
                    choices.push(randomChar);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            
            choices.forEach(char => {
                const btn = document.createElement('button');
                btn.className = `choice-btn`;
                btn.innerText = char;
                
                btn.onclick = () => {
                    if (char === targetLetter) {
                        btn.innerHTML = `<span style="font-size: 2.25rem; color: #ef4444; font-weight: bold;">❌</span>`;
                        btn.className = `choice-correct`;
                        score += 1;
                        speakText('สุดยอดจริงๆ ค่ะ'); // ตอบถูกพูดคำนี้ตามสั่ง
                        
                        disableAllButtons(true);
                        currentQuestion++;
                        setTimeout(nextQuestion, 1200);
                    } else {
                        btn.innerHTML = `<span style="font-size: 1.875rem; color: #9ca3af;">❌</span>`;
                        speakText('ลองใหม่ค่ะ');
                    }
                };
                gridContainer.appendChild(btn);
            });

            setTimeout(speakQuestion, 400);
        }

        function disableAllButtons(disable) {
            const buttons = document.querySelectorAll('.grid-container button');
            buttons.forEach(btn => btn.disabled = disable);
        }

        window.onload = () => {
            nextQuestion();
        };
    </script>
</body>
</html>
